name: PARADOX — refresh contribution landscape
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: write
concurrency:
  group: paradox-contributions
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'EthicalMaster/EthicalMaster'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render contribution landscape
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 tools/contributions.py
      - name: Commit only if the artwork changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/contributions-static.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh PARADOX contribution landscape'
          git push
