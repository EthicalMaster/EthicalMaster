name: Update public contribution artwork
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: write
concurrency:
  group: contribution-artwork
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate artwork
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 tools/contributions.py
      - name: Commit changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh contribution artwork'
          git push
