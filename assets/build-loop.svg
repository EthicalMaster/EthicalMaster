<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 172" role="img" aria-labelledby="t d"><title id="t">From ideas to systems</title><desc id="d">An animated circuit connecting explore, design, build and verify.</desc><style>.trace{stroke-dasharray:780;animation:trace 4.5s ease-out both}.node{animation:appear .9s ease-out both}@keyframes trace{from{stroke-dashoffset:780}to{stroke-dashoffset:0}}@keyframes appear{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="171" rx="14" fill="#10151c" stroke="#394653"/><text x="26" y="28" fill="#a6bacb" font-size="12" letter-spacing="2" font-family="monospace">FIG. 02 / THE BUILD LOOP</text><path d="M105 78H795" stroke="#344654" stroke-width="2"/><path class="trace" d="M105 78H795" stroke="#98c9e8" stroke-width="2"/><g class="node" style="animation-delay:0.0s"><circle cx="105" cy="78" r="20" fill="#18242e" stroke="#8ba9bf"/><circle cx="105" cy="78" r="5" fill="#c2e3f6"/><text x="105" y="122" text-anchor="middle" font-family="monospace" font-size="15" fill="#e4edf4" letter-spacing="1">EXPLORE</text></g><g class="node" style="animation-delay:0.65s"><circle cx="335" cy="78" r="20" fill="#18242e" stroke="#8ba9bf"/><circle cx="335" cy="78" r="5" fill="#c2e3f6"/><text x="335" y="122" text-anchor="middle" font-family="monospace" font-size="15" fill="#e4edf4" letter-spacing="1">DESIGN</text></g><g class="node" style="animation-delay:1.3s"><circle cx="565" cy="78" r="20" fill="#18242e" stroke="#8ba9bf"/><circle cx="565" cy="78" r="5" fill="#c2e3f6"/><text x="565" y="122" text-anchor="middle" font-family="monospace" font-size="15" fill="#e4edf4" letter-spacing="1">BUILD</text></g><g class="node" style="animation-delay:1.9500000000000002s"><circle cx="795" cy="78" r="20" fill="#18242e" stroke="#8ba9bf"/><circle cx="795" cy="78" r="5" fill="#c2e3f6"/><text x="795" y="122" text-anchor="middle" font-family="monospace" font-size="15" fill="#e4edf