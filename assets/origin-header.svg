acity=".9"/><circle r="17" fill="none" stroke="#a0c5e0" stroke-opacity=".35"/></g><g class="intro" font-family="Arial, Helvetica, sans-serif"><text x="40" y="106" fill="#aabfd1" font-size="13" letter-spacing="4">DESIGN. BUILD. EXPLORE.</text><text x="36" y="176" fill="#f0f4f9" font-size="66" font-weight="700" letter-spacing="-3">TAHER</text><text x="36" y="245" fill="#f0f4f9" font-size="66" font-weight="700" letter-spacing="-3">SAIFEE.</text></g><g class="second"><text x="41" y="277" fill="#c1d0df" font-family="Arial,sans-serif" font-size="17">Software / AI / Data Science</text></g><path class="signal" d="M40 299H480" stroke="#a2c8e0" stroke-dasharray="450" stroke-width="1.5" fill="none"/><g fill="#a8bdcf" font-family="monospace" font-size="12" letter-spacing="1.5"><circle cx="44" cy="327" r="3.5" fill="#a6dfc9"/><text x="58" y="331">LEARNING BY BUILDING</text><text x="861" y="331" text-anchor="end">FIG. 01 / ORBITAL FORM</text></g></g><rect x=".5" y=".5" width="899" height="364" rx="18" fill="none" stroke="#3b4856"/></svg>